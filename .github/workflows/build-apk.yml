name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: |
          EXPO_ROUTER_APP_ROOT="$PWD/app" node -e "require('fs').mkdirSync('.expo/types', { recursive: true }); require('expo-router/build/typed-routes').regenerateDeclarations('.expo/types');"
          npm run typecheck

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Install native image processing dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare native version and assets
        run: |
          node scripts/sync-android-version.mjs
          node scripts/sync-android-assets.mjs
          node scripts/prepare-bundled-speech-models.mjs

      - name: Enable JS bundling in debug build
        run: |
          # By default, debuggableVariants=["debug"] skips JS bundling.
          # Set it to empty so the debug APK includes the embedded JS bundle.
          sed -i 's|react {|react {\n    debuggableVariants = []|' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=${GITHUB_SHA::7}
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/wtt-${VERSION}-${SHORT_SHA}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtt-apk-debug
          path: android/app/build/outputs/apk/debug/wtt-*.apk
          retention-days: 30

  release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Install native image processing dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build release APK
        run: npm run build:android:universal

      - name: Rename release APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=${GITHUB_SHA::7}
          APK_SRC=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK_SRC" "android/app/build/outputs/apk/release/wtt-${VERSION}-${SHORT_SHA}-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wtt-apk-release
          path: android/app/build/outputs/apk/release/wtt-*-release.apk
          retention-days: 90
